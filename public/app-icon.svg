<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2a1614" />
      <stop offset="100%" stop-color="#0f0a09" />
    </radialGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="#3d2c2b" stroke-width="8" />

  <!-- Outer Red Accent Ring -->
  <circle cx="256" cy="256" r="180" stroke="#ef4444" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="16 12" />

  <!-- Central Badge Shadow -->
  <circle cx="256" cy="256" r="140" fill="#ef4444" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="256" cy="256" r="130" fill="#1f1614" stroke="#ef4444" stroke-width="6" />

  <!-- Sigma Greek Symbol for Study Sprint (Σ) in Vibrant Red -->
  <path d="M 330 180 L 190 180 L 270 256 L 190 332 L 330 332 L 330 310 L 225 310 L 285 256 L 225 202 L 330 202 Z" fill="url(#primary-grad)" />

  <!-- Small Graduation / Sparkle dot -->
  <circle cx="330" cy="180" r="10" fill="#f87171" />
</svg>
